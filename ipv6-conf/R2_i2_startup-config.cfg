! File: R2_i2_startup-config.cfg
! Purpose: Dual-stack VPN configuration preserving IPv4 and adding IPv6 VPN service.
! Author: Mustafa  Ismail | Date: 2026-10-06
!

!
! Last configuration change at 11:39:59 UTC Sun Oct 4 2026
!
! Select the IOS software version used by this lab.
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
! Give this router its lab identity.
hostname R2
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
no ip icmp rate-limit unreachable
ip cef
! Enable IPv6 forwarding alongside the existing IPv4 stack.
ipv6 unicast-routing
ipv6 cef
!
!
!
!
!
!
no ip domain lookup
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
!
!
!
!
!
!
!
!
! Provide a stable router identifier and loopback address.
interface Loopback0
 ip address 2.2.2.2 255.255.255.255
 ! IPv6 provider core address; existing IPv4 addressing remains configured.
 ipv6 address 2001:db8:100::2/128
 ipv6 ospf 1 area 0
 ip ospf 1 area 0
!
! Connect this router to the provider MPLS core.
interface FastEthernet0/0
 ip address 12.0.0.2 255.255.255.0
 ! IPv6 provider core address; existing IPv4 addressing remains configured.
 ipv6 address 2001:db8:12::2/64
 ipv6 ospf 1 area 0
 ip ospf 1 area 0
 duplex full
 mpls ip
!
! Connect this router to the provider MPLS core.
interface FastEthernet1/0
 ip address 23.0.0.2 255.255.255.0
 ! IPv6 provider core address; existing IPv4 addressing remains configured.
 ipv6 address 2001:db8:23::2/64
 ipv6 ospf 1 area 0
 ip ospf 1 area 0
 speed auto
 duplex auto
 mpls ip
!
! Keep this unused interface shut down as in the original lab.
interface FastEthernet1/1
 no ip address
 shutdown
 speed auto
 duplex auto
!
! Keep this unused interface shut down as in the original lab.
interface FastEthernet2/0
 no ip address
 shutdown
 speed auto
 duplex auto
!
! Keep this unused interface shut down as in the original lab.
interface FastEthernet2/1
 no ip address
 shutdown
 speed auto
 duplex auto
!
! Run a separate IPv6 OSPF process across the provider core links.
! Advertise IPv6 provider-core reachability with OSPFv3.
ipv6 router ospf 1
 router-id 2.2.2.2
!
! Advertise IPv4 provider-core reachability with OSPF.
router ospf 1
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
!
!
!
! Preserve the original control-plane section.
control-plane
!
!
! Keep the original console access settings.
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
! Keep the original auxiliary access settings.
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
! Keep the original remote-terminal access settings.
line vty 0 4
 login
!
!
end
