! File: R3_i4_startup-config.cfg
! Purpose: Dual-stack VPN configuration preserving IPv4 and adding IPv6 VPN service.
! Author: Mustafa  Ismail | Date: 2026-10-06
!

!
! Last configuration change at 12:46:17 UTC Sun Oct 4 2026
!
! Select the IOS software version used by this lab.
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
! Give this router its lab identity.
hostname R3
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
no ip icmp rate-limit unreachable
ip cef
! Enable IPv6 forwarding alongside the existing IPv4 stack.
ipv6 unicast-routing
ipv6 cef
!
! Define shared IPv4 and IPv6 routing for the CIB2 customer.
vrf definition CIB2
 rd 100:1
 address-family ipv4
  route-target export 100:1
  route-target import 100:1
 exit-address-family
 address-family ipv6
  route-target export 100:1
  route-target import 100:1
 exit-address-family
!
! Define shared IPv4 and IPv6 routing for the QNB2 customer.
vrf definition QNB2
 rd 300:1
 address-family ipv4
  route-target export 300:1
  route-target import 300:1
 exit-address-family
 address-family ipv6
  route-target export 300:1
  route-target import 300:1
 exit-address-family
!
!
!
!
!
!
no ip domain lookup
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
!
!
!
!
!
!
!
!
! Provide a stable router identifier and loopback address.
interface Loopback0
 ip address 3.3.3.3 255.255.255.255
 ! IPv6 provider core address; existing IPv4 addressing remains configured.
 ipv6 address 2001:db8:100::3/128
 ipv6 ospf 1 area 0
 ip ospf 1 area 0
!
! Connect this router to the provider MPLS core.
interface FastEthernet0/0
 ip address 23.0.0.3 255.255.255.0
 ! IPv6 provider core address; existing IPv4 addressing remains configured.
 ipv6 address 2001:db8:23::3/64
 ipv6 ospf 1 area 0
 ip ospf 1 area 0
 duplex full
 mpls ip
!
! Connect the customer-facing interface to its isolated VRF.
interface FastEthernet1/0
 vrf forwarding CIB2
 ip address 35.0.0.3 255.255.255.0
 ! IPv6 customer VPN address; existing IPv4 addressing remains configured.
 ipv6 address 2001:db8:35::3/64
 speed auto
 duplex auto
!
! Connect the customer-facing interface to its isolated VRF.
interface FastEthernet1/1
 vrf forwarding QNB2
 ip address 35.0.0.3 255.255.255.0
 ! IPv6 customer VPN address; existing IPv4 addressing remains configured.
 ipv6 address 2001:db8:35::3/64
 speed auto
 duplex auto
!
! Keep this unused interface shut down as in the original lab.
interface FastEthernet2/0
 no ip address
 shutdown
 speed auto
 duplex auto
!
! Keep this unused interface shut down as in the original lab.
interface FastEthernet2/1
 no ip address
 shutdown
 speed auto
 duplex auto
!
! Run a separate IPv6 OSPF process across the provider core links.
! Advertise IPv6 provider-core reachability with OSPFv3.
ipv6 router ospf 1
 router-id 3.3.3.3
!
! Advertise IPv4 provider-core reachability with OSPF.
router ospf 1
!
! Exchange routes for the listed address families using BGP.
router bgp 100
 bgp log-neighbor-changes
 neighbor 1.1.1.1 remote-as 100
 neighbor 1.1.1.1 update-source Loopback0
 !
 address-family vpnv4
  neighbor 1.1.1.1 activate
  neighbor 1.1.1.1 send-community both
  neighbor 1.1.1.1 next-hop-self
 exit-address-family
 !
 address-family ipv4 vrf CIB2
  network 35.0.0.0 mask 255.255.255.0
  neighbor 35.0.0.5 remote-as 200
  neighbor 35.0.0.5 activate
  neighbor 35.0.0.5 as-override
 exit-address-family
 !
 address-family ipv4 vrf QNB2
  network 35.0.0.0 mask 255.255.255.0
  neighbor 35.0.0.6 remote-as 300
  neighbor 35.0.0.6 activate
  neighbor 35.0.0.6 as-override
 exit-address-family
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
!
!
!
! Preserve the original control-plane section.
control-plane
!
!
! Keep the original console access settings.
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
! Keep the original auxiliary access settings.
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
! Keep the original remote-terminal access settings.
line vty 0 4
 login
!
!
! Add a parallel IPv6 routing address family.
! Exchange customer IPv6 routes using VPNv6 and the existing IPv4 MPLS core.
! Exchange routes for the listed address families using BGP.
router bgp 100
 address-family vpnv6
  neighbor 1.1.1.1 activate
  neighbor 1.1.1.1 send-community both
 exit-address-family
 address-family ipv6 vrf CIB2
  network 2001:db8:35::/64
  neighbor 2001:db8:35::5 remote-as 200
  neighbor 2001:db8:35::5 activate
  neighbor 2001:db8:35::5 as-override
 exit-address-family
 address-family ipv6 vrf QNB2
  network 2001:db8:35::/64
  neighbor 2001:db8:35::6 remote-as 300
  neighbor 2001:db8:35::6 activate
  neighbor 2001:db8:35::6 as-override
 exit-address-family

end
