! File: R4_i3_startup-config.cfg
! Purpose: Dual-stack VPN configuration preserving IPv4 and adding IPv6 VPN service.
! Author: Mustafa  Ismail | Date: 2026-10-06
!

!
! Last configuration change at 12:21:46 UTC Sun Oct 4 2026
!
! Select the IOS software version used by this lab.
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
! Give this router its lab identity.
hostname R4
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
no ip icmp rate-limit unreachable
ip cef
! Enable IPv6 forwarding alongside the existing IPv4 stack.
ipv6 unicast-routing
ipv6 cef
!
!
!
!
!
!
no ip domain lookup
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
!
!
!
!
!
!
!
!
!
!
!
!
! Provide a branch loopback that is advertised to the VPN.
interface Loopback0
 ip address 4.4.4.4 255.255.255.255
 ! IPv6 customer VPN address; existing IPv4 addressing remains configured.
 ipv6 address 2001:db8:200::4/128
!
! Connect this customer branch to its provider edge.
interface FastEthernet0/0
 ip address 14.0.0.4 255.255.255.0
 ! IPv6 customer VPN address; existing IPv4 addressing remains configured.
 ipv6 address 2001:db8:14::4/64
 duplex full
!
! Keep this unused interface shut down as in the original lab.
interface FastEthernet1/0
 no ip address
 shutdown
 speed auto
 duplex auto
!
! Keep this unused interface shut down as in the original lab.
interface FastEthernet1/1
 no ip address
 shutdown
 speed auto
 duplex auto
!
! Keep this unused interface shut down as in the original lab.
interface FastEthernet2/0
 no ip address
 shutdown
 speed auto
 duplex auto
!
! Keep this unused interface shut down as in the original lab.
interface FastEthernet2/1
 no ip address
 shutdown
 speed auto
 duplex auto
!
! Exchange routes for the listed address families using BGP.
router bgp 200
 bgp log-neighbor-changes
 network 4.4.4.4 mask 255.255.255.255
 network 14.0.0.0 mask 255.255.255.0
 neighbor 14.0.0.1 remote-as 100
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
!
!
!
! Preserve the original control-plane section.
control-plane
!
!
! Keep the original console access settings.
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
! Keep the original auxiliary access settings.
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
! Keep the original remote-terminal access settings.
line vty 0 4
 login
!
!
! Add a parallel IPv6 routing address family.
! Advertise this branch loopback and link prefix over IPv6 eBGP.
! Exchange routes for the listed address families using BGP.
router bgp 200
 address-family ipv6
  network 2001:db8:200::4/128
  network 2001:db8:14::/64
  neighbor 2001:db8:14::1 remote-as 100
  neighbor 2001:db8:14::1 activate
 exit-address-family

end
